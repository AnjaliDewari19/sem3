<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body{
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
            font-family: Cambria,'Times New Roman';
            text-align: center;
        }
        h1{
            padding: 10px;
            font-size: 60px;
        }
        .box{
            background: white;
            width: 600px;
            height : 400px;
            margin: 40px auto;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgb(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        input {
            padding: 8px;
            margin: 5px;
            width : 500px;
            height: 50px;
            font-size: 20px;
            border-radius: 10px;
            border-color: black;
        }
        .addBtn{
            background: rgb(4, 163, 4);
            width : 100px;
            height: 70px;
            color : white;
            font-size: 20px;
            border-radius: 10px ;
            font-family: Cambria;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header><center><h1>CALCULATOR</h1></center></header>
    <div class="box">
        <input id="num1" placeholder="Enter First Number"><br><br>
        <input id="num2" placeholder="Enter Second Number"><br><br>
        <button class="addBtn" onclick="add()"><strong>+</strong></button>
        <button class="addBtn" onclick="sub()"><strong>-</strong></button>
        <button class="addBtn" onclick="mul()"><strong>*</strong></button>
        <button class="addBtn" onclick="div()"><strong>/</strong></button>
    <p id="output"></p>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
