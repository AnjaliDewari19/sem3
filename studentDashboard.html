<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body{
            font-family:'Times New Roman', Times, serif;
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
            text-align: center;
        }
        h1{
            padding:5px;
            font-size:50px;
        }
        .link{
            background: white;
            height: 40px;
            width: 200px;
            font-size: 25px;
            border-radius: 10px;
            padding: 10px;
            font-weight:bold;
            text-align: center;
            margin: 20px auto 10px auto;
            cursor: pointer;
        }
        .box{
            background: white;
            width: 600px;
            margin: 40px auto;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgb(0,0,0,0.5);
        }
        .btn{
            background: rgb(42, 165, 60);
            height: 50px;
            color : white;
            font-size: 20px;
            border-radius: 10px ;
            font-family: Cambria;
            cursor: pointer;
            margin : 5px;
        }
        .main{
            background: white;
            width: 600px;
            margin: 40px auto;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgb(0,0,0,0.5);
            display: none; /* hidden until "Registration" button is clicked */
        }
        h2{
            font-size: 30px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width : 500px;
            height: 30px;
            font-size: 20px;
        }
        #addBtn{
            background: green;
            height: 50px;
            color : white;
            font-size: 20px;
            border-radius: 10px ;
            font-family: Cambria;
            cursor: pointer;
        }
        .output{
            background: white;
            width: 600px;
            margin: 40px auto;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 6px 10px rgb(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <h1>STUDENT DASHBOARD</h1>

    <div class="link" onclick="toggleRegistration()">Registration</div>

    <div class="main" id="registrationForm">
        <center>
        <h2>REGISTRATION</h2>
        <input type="text" id="name" placeholder="NAME" required><br><br>
        <input type="number" id="roll" placeholder="ROLL NO." required><br><br>
        <input type="date" id="dob" placeholder="dd/mm/yyyy" required><br><br>
        <input type="text" id="branch" placeholder="BRANCH e.g. CSE DS, CSE AIML" required><br><br>
        <input type="tel" id="phone" placeholder="CONTACT NO." required><br><br>
        <button id="addBtn" onclick="addStudent()">ADD STUDENT</button>
        </center>
    </div>

    <div class="box">
        <button class="btn" onclick="display()">DISPLAY ALL</button>
        <button class="btn" onclick="Sname()">SEARCH BY NAME</button>
        <button class="btn" onclick="branch()">FILTER BY BRANCH</button>
        <button class="btn" onclick="del()">DELETE</button>
        <button class="btn" onclick="total()">TOTAL NUMBER OF STUDENT</button>
    </div>

    <div class="output">
        <div id="output"></div>
    </div>

    <script src="stu.js"></script>
</body>
</html>
